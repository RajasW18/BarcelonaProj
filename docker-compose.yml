
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: barca
      POSTGRES_PASSWORD: barca
      POSTGRES_DB: barcadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barca -d barcadb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
